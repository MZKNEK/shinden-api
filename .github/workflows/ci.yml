name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Lets Codecov authenticate the upload with GitHub OIDC instead of a stored token.
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # SDK 10 builds every target (net6.0, net8.0, net10.0, netstandard2.0);
      # the .NET 6 runtime runs the net6.0 tests.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore src/Shinden.NET.csproj
          dotnet restore src/DependencyInjection/Shinden.NET.DependencyInjection.csproj
          dotnet restore live/Shinden.NET.LiveTests.csproj
          dotnet restore test/Shinden.NET.Test.csproj

      - name: Build
        run: |
          dotnet build src/Shinden.NET.csproj -c Release --no-restore
          dotnet build src/DependencyInjection/Shinden.NET.DependencyInjection.csproj -c Release --no-restore
          dotnet build live/Shinden.NET.LiveTests.csproj -c Release --no-restore

      - name: Test
        run: >
          dotnet test test/Shinden.NET.Test.csproj -c Release --no-restore
          --collect:"XPlat Code Coverage" --results-directory TestResults
          --logger "trx;LogFilePrefix=results"

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: TestResults/*/coverage.cobertura.xml
          fail_ci_if_error: false

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
